[mypy]
python_version = 3.11
files =
    # contracts/result
    backtest/result/contracts.py,
    backtest/pipeline_result.py,
    # metrics/slot broker
    backtest/metrics/engine_metrics_stats.py,
    backtest/metrics/engine_metrics_trade_ops.py,
    backtest/slot_broker_risk_fills.py,
    # batch/allocation
    backtest/allocation/allocator.py,
    backtest/allocation/state.py,
    # data readers
    data/market_data_frames.py,
    data/market_data_mysql.py,
    data/timing_readers.py,
    # Web backend
    web/export_holdings.py,
    web/holdings/common.py,
    web/insights/metrics.py,
    web/insights/health.py
follow_imports = skip
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = False
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
