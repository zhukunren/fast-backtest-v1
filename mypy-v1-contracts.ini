[mypy]
python_version = 3.11
files =
    config/app_config.py,
    backtest/context.py,
    backtest/artifacts/catalog.py,
    backtest/artifacts/generation.py,
    backtest/decisions/contracts.py,
    backtest/engines/contracts.py,
    backtest/engines/registry.py,
    backtest/pipeline_result.py,
    backtest/result/contracts.py,
    strategies/advanced.py,
    strategies/spec.py,
    core/research_identity.py,
    runtime_lifecycle/reset.py,
    strategies/code_security.py,
    strategies/static_check.py
follow_imports = skip
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
