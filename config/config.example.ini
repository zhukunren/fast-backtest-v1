# Safe local override example for the full workspace.
#
# Copy this file to config/config.local.ini and edit local values there.
# Do not commit config.local.ini, database passwords, vendor tokens, or local
# absolute paths.

[paths]
data_root = .

[backtest]
start_time = 20240102
end_time = 20260609
offset_days = 250
universe_prefixes = 300,301,688
exclude_bj = 1
exclude_st = 1
benchmark_code = 399006.SZ
benchmark_name = ChiNext Index
benchmark_source_codes = 399006.SZ,399006.SH

[run]
run_mode = curve
clear_outputs = 1
clear_all_tables = 0
quiet = 0
signal_available_at = after_close
exec_buy_timing = next_open
exec_sell_timing = next_open
exec_shift_t1 = 1
exec_allow_intraday = 0
pydantic_validate = 0

[strategy]
module = strategy_library\builtin\offline_smoke.py

[portfolio]
engine = legacy
force_close_mode = mark_to_market
initial_capital = 1000000
position_size_method = equal
lot_size = 100

[fixed_rebalance]
target_weights =
symbol_type = etf
rebalance_frequency = month_start
rebalance_dates =
buy_price_col = open
sell_price_col = open
mark_price_col = close
normalize_weights = 0

[trade_constraints]
# fixed_rebalance uses these checks before each target-weight rebalance fill.
enable_no_trade_day = 1
enable_limit = 1
enable_volume_limit = 0
require_next_bar = 1

[panel]
source = parquet
path = data/panel_cache/stock_daily.parquet
incomplete_ohlcv_policy = drop_warn

[mysql]
host = localhost
port = 3306
user = root
password =
password_env = MYSQL_PASSWORD
# Default is fail-closed. Enable only for explicit local-development recovery.
allow_local_auth_fallback = 0
charset = utf8mb4
stock_db = stock_data
index_db = index_data
etf_db = etf_data
ths_index_db = ths_index_daily
ths_index_member_db = ths_index_member
daily_fields = amount,net_mf_amount,pre_close,pct_chg
driver = mysqldb

[tushare]
# V1 运行时回测的官方执行日历必需；非空环境变量优先于 token 配置值。
token =
token_env = TUSHARE_TOKEN
token_env_alt = TS_TOKEN
exchange =
trade_cal_start =
trade_cal_end =

[diagnostics]
enabled = 1
multi_start_enabled = 0
