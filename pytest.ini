[pytest]
addopts = -p no:cacheprovider
testpaths = tests web/tests
norecursedirs = .git output _pytest_tmp _pytest_tmp_access _pytest_cmd_test _pytest_tmp_cmd _pytest_tmp_ps _pytest_tmp_ps2
markers =
    unit: fast isolated tests for local helpers and thin entrypoints
    integration: multi-module boundary tests that keep real contracts in place
    e2e: end-to-end execution checks that run the real pipeline
    slow: slower smoke or pipeline tests
filterwarnings =
    ignore:distutils Version classes are deprecated:DeprecationWarning:pytest_freezegun
