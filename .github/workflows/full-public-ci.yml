name: full-public-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-public:
    runs-on: windows-latest
    env:
      # The local-price smoke still requires the official TuShare calendar.
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install pip setuptools wheel -c constraints-ci.txt
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip install --no-build-isolation -e ".[dev]" -c constraints-ci.txt

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Audit public surface
        run: python tools/audit_full_public_surface.py

      - name: Run offline and Web smoke
        run: python tools/smoke_full_public_repo.py
