name: Bug report
description: Report reproducible public package behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, code, and sample data needed to reproduce.
      render: powershell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: jshs version or commit hash.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and dependency versions.
      render: text
